name: CI

on:
  push:
    branches: ["main", "master", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: 静的解析・型検査・単体テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: uv のセットアップ
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 依存関係のインストール
        run: uv sync --extra train

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: 整形チェック (ruff format)
        run: uv run ruff format --check .

      - name: 型検査 (mypy strict)
        run: uv run mypy

      - name: 単体テスト
        run: uv run pytest -m "not slow" --cov --cov-report=xml --cov-report=term-missing

      - name: カバレッジの保存
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  pipeline:
    name: パイプライン結合テスト
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: uv のセットアップ
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 依存関係のインストール
        run: uv sync --extra train

      # 生成器のパラメータを変えると、まずここが落ちる。
      # 「動いた」ことと「使えるデータができた」ことは別なので、両方を通す。
      - name: 本番設定での合格基準チェック
        run: uv run pytest -m slow

      # README に書いてある手順が本当に動くかを、README とは独立に検証する。
      # 手順書が腐るのは「実行されないから」なので、CI で実行してしまう。
      - name: README の手順どおりに動かす
        run: |
          uv run sales generate
          uv run sales check-data
          uv run python scripts/explore_transactions.py

      - name: 生成データの保存
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: |
            data/raw/transactions.csv
            data/raw/customers.csv
            data/raw/anomaly_labels.csv
          if-no-files-found: error
