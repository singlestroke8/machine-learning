# 販売管理データの生成設定
#
# ここに置くのは「業務設定として人が決める値」だけ。
# 分布の形を決める定数は src/sales_analytics/data/masters.py にある。

seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  model_dir: models
  reports_dir: reports
  mlflow_tracking_uri: sqlite:///mlflow.db

transactions:
  # 3年分。年周期を学習するには最低2回、余裕を見て3回ぶん必要
  start_date: 2022-01-01
  end_date: 2024-12-31
  # 顧客単位の課題（離反予測・セグメント）を成立させるための規模
  n_customers: 200
  reps_per_department: 5
  # 期間の途中から取引が始まる顧客の割合
  new_customer_ratio: 0.25
  # 期間の途中で取引が先細って止まる顧客の割合
  churn_ratio: 0.18
