# =============================================================================
# B2B 取引データ（営業日ベース）の設定
#
# conf/config.yaml が小売想定の暦日データ用なのに対し、こちらは
# 法人取引の営業日データ用。時間軸の刻みが違うため設定を分けている。
#
#   uv run dfc generate-transactions -c conf/b2b.yaml
#   uv run dfc build-demand          -c conf/b2b.yaml
#   uv run dfc train                 -c conf/b2b.yaml
# =============================================================================

seed: 42

paths:
  # build-demand の出力先であり、train の入力元
  raw: data/processed/demand_b2b.parquet
  processed: data/processed/train_frame_b2b.parquet
  model_dir: models/b2b
  reports_dir: reports/b2b
  mlflow_tracking_uri: sqlite:///mlflow.db

# 小売の合成データ生成には使わないが、設定の構造上は必須なので最小値を置く
data:
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  n_stores: 1
  n_skus: 1

transactions:
  output: data/raw/transactions.csv
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  n_customers: 80
  reps_per_department: 4

features:
  # 営業日のみを時間軸にする。1週間 = 5ステップとして曜日周期を扱う
  calendar: business
  # 10営業日先（約2週間）まで予測する
  horizon: 10
  # ラグの単位は営業日。1日前・2日前・3日前・1週前・2週前・4週前
  lags: [1, 2, 3, 5, 10, 20]
  # 移動集計の窓も営業日。1週間・4週間・12週間
  rolling_windows: [5, 20, 60]
  fourier_yearly_order: 3

cv:
  # 20営業日（約4週間）を1分割として3回検証する
  n_splits: 3
  val_steps: 20
  gap_steps: 0

model:
  quantiles: [0.1, 0.5, 0.9]
  params:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    min_child_samples: 40
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0

tuning:
  n_trials: 20
  timeout_seconds: 600

api:
  model_path: models/b2b/model.joblib
