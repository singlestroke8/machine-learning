# 推論APIをローカルで本番同等に動かすための構成。
#
# モデルはイメージに焼き込まず、ボリュームで渡している。モデルを焼き込むと
# 再学習のたびにイメージを作り直すことになり、
# 「コードは変わっていないのにイメージのタグだけ増える」状態になるため。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: demand-forecast-api:local
    container_name: demand-forecast-api
    ports:
      - "8000:8000"
    volumes:
      # 学習済みモデルを読み取り専用でマウントする
      - ./models:/app/models:ro
    environment:
      DFC_MODEL_PATH: /app/models/model.joblib
      DFC_LOG_LEVEL: INFO
    restart: unless-stopped
